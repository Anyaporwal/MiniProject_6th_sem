<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SafeRoute - Secure Access</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#68000a",
                        "on-secondary-fixed-variant": "#00522c",
                        "on-tertiary-fixed-variant": "#930013",
                        "inverse-primary": "#00629d",
                        "outline-variant": "#404751",
                        "secondary-container": "#2ca464",
                        "on-primary-fixed": "#001d34",
                        "secondary": "#6bdc96",
                        "on-primary-container": "#002f4e",
                        "primary-fixed": "#cfe5ff",
                        "tertiary": "#ffb3ad",
                        "primary-fixed-dim": "#99cbff",
                        "tertiary-fixed-dim": "#ffb3ad",
                        "background": "#0b1326",
                        "surface-container-highest": "#2d3449",
                        "surface-container": "#171f33",
                        "primary-container": "#4299e1",
                        "outline": "#8a919c",
                        "tertiary-container": "#ff5b56",
                        "tertiary-fixed": "#ffdad7",
                        "inverse-surface": "#dae2fd",
                        "secondary-fixed": "#88f9b0",
                        "inverse-on-surface": "#283044",
                        "on-secondary-container": "#003118",
                        "error-container": "#93000a",
                        "surface-dim": "#0b1326",
                        "secondary-fixed-dim": "#6bdc96",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#410004",
                        "on-primary": "#003355",
                        "on-surface": "#dae2fd",
                        "on-error-container": "#ffdad6",
                        "surface-variant": "#2d3449",
                        "surface-bright": "#31394d",
                        "on-error": "#690005",
                        "on-secondary": "#00391d",
                        "surface": "#0b1326",
                        "surface-container-lowest": "#060e20",
                        "on-tertiary-container": "#610008",
                        "on-primary-fixed-variant": "#004a78",
                        "surface-container-high": "#222a3d",
                        "on-surface-variant": "#c0c7d2",
                        "primary": "#99cbff",
                        "surface-container-low": "#131b2e",
                        "on-secondary-fixed": "#00210f",
                        "on-background": "#dae2fd",
                        "surface-tint": "#99cbff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1326; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-panel { backdrop-filter: blur(12px); border: 1px solid rgba(64, 71, 81, 0.15); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface selection:bg-primary/30 min-h-screen flex flex-col items-center justify-center p-4">
<!-- Hero Background Element -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] rounded-full bg-secondary/5 blur-[120px]"></div>
</div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-[440px] flex flex-col gap-8">
<!-- Brand Header -->
<header class="flex flex-col items-center gap-2 text-center">
<div class="w-16 h-16 bg-gradient-to-br from-primary to-primary-container rounded-2xl flex items-center justify-center shadow-[0_0_30px_rgba(66,153,225,0.3)] mb-2">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="security">security</span>
</div>
<h1 class="text-3xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-primary to-primary-container leading-none">
                SafeRoute
            </h1>
<p class="text-on-surface-variant text-sm font-medium tracking-wide">THE DIGITAL GUARDIAN</p>
</header>
<!-- Auth Card -->
<section class="surface-container-highest/40 glass-panel rounded-[2rem] p-8 shadow-2xl overflow-hidden bg-surface-container">
<!-- Tab Toggle -->
<div class="flex p-1.5 bg-surface-container-lowest rounded-2xl mb-8">
<button class="flex-1 py-3 px-4 rounded-xl text-sm font-bold tracking-tight transition-all duration-300 bg-primary-container text-on-primary-container shadow-lg">
                    Login
                </button>
<button class="flex-1 py-3 px-4 rounded-xl text-sm font-bold tracking-tight transition-all duration-300 text-on-surface-variant hover:text-on-surface">
                    Register
                </button>
</div>
<!-- Login Form (Visible by default) -->
<form class="flex flex-col gap-5">
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-low border-none rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/50 transition-all" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-[11px] font-bold text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-low border-none rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/50 transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-3 px-1 mt-1">
<input class="w-5 h-5 rounded-md border-outline-variant bg-surface-container-low text-primary focus:ring-primary-container focus:ring-offset-0" id="remember" type="checkbox"/>
<label class="text-sm font-medium text-on-surface-variant cursor-pointer" for="remember">Stay protected on this device</label>
</div>
<!-- Primary CTA -->
<button class="mt-4 w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-black text-sm uppercase tracking-widest py-4 rounded-xl shadow-[0_10px_20px_rgba(66,153,225,0.2)] active:scale-95 transition-all duration-200" type="submit">
                    Secure Login
                </button>
</form>
<!-- Social/Alternative Auth -->
<div class="mt-10">
<div class="relative flex items-center mb-8">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 text-[10px] font-black uppercase tracking-[0.2em] text-outline/60">Verification Methods</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-low py-3.5 rounded-xl text-xs font-bold text-on-surface hover:bg-surface-container-high transition-colors group">
<span class="material-symbols-outlined text-xl text-primary group-hover:scale-110 transition-transform" data-icon="fingerprint">fingerprint</span>
                        Biometrics
                    </button>
<button class="flex items-center justify-center gap-3 bg-surface-container-low py-3.5 rounded-xl text-xs font-bold text-on-surface hover:bg-surface-container-high transition-colors group">
<span class="material-symbols-outlined text-xl text-primary group-hover:scale-110 transition-transform" data-icon="key">key</span>
                        Passkey
                    </button>
</div>
</div>
</section>
<!-- Footer Info -->
<footer class="flex flex-col items-center gap-6">
<div class="flex items-center gap-2 bg-secondary/10 px-4 py-2 rounded-full">
<span class="material-symbols-outlined text-secondary text-lg" data-icon="verified_user" data-weight="fill" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="text-[10px] font-bold text-secondary uppercase tracking-widest">End-to-End Encrypted Access</span>
</div>
<p class="text-xs text-on-surface-variant/60 text-center leading-relaxed max-w-[300px]">
                By entering, you agree to our <a class="text-on-surface-variant hover:text-primary transition-colors underline underline-offset-4" href="#">Privacy Standards</a> and <a class="text-on-surface-variant hover:text-primary transition-colors underline underline-offset-4" href="#">Citizen Protocol</a>.
            </p>
</footer>
</main>
<!-- Visual Anchor: Safe Route Hint -->
<div class="fixed bottom-0 left-0 w-full p-8 hidden md:block opacity-30 pointer-events-none">
<div class="flex justify-between items-end border-t border-outline-variant/20 pt-4">
<div class="flex flex-col">
<span class="text-[10px] font-black uppercase tracking-widest text-outline">Active Node</span>
<span class="text-sm font-bold text-secondary">NAGPUR_SECURE_V4</span>
</div>
<div class="flex flex-col items-end">
<span class="text-[10px] font-black uppercase tracking-widest text-outline">System Latency</span>
<span class="text-sm font-bold text-primary">14ms</span>
</div>
</div>
</div>
</body></html>
