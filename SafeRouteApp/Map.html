<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        .map-overlay-gradient {
            background: radial-gradient(circle, transparent 20%, rgba(11, 19, 38, 0.8) 100%);
        }
        .hotspot-glow-high { filter: blur(20px); opacity: 0.6; background-color: #ff5b56; }
        .hotspot-glow-med { filter: blur(20px); opacity: 0.5; background-color: #f59e0b; }
        .hotspot-glow-low { filter: blur(20px); opacity: 0.4; background-color: #6bdc96; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface select-none overflow-hidden h-screen w-full">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-900/80 backdrop-blur-xl flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-blue-400 text-2xl" data-icon="security">security</span>
<h1 class="text-xl font-black text-blue-400 tracking-tighter Inter">SafeRoute</h1>
</div>
<div class="flex items-center gap-4">
<!-- Day/Night Toggle -->
<div class="flex bg-surface-container-highest rounded-full p-1 items-center">
<button class="p-1.5 rounded-full bg-slate-800/50 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="light_mode">light_mode</span>
</button>
<button class="p-1.5 rounded-full bg-primary-container text-on-primary-container shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="dark_mode">dark_mode</span>
</button>
</div>
<div class="h-10 w-10 rounded-full overflow-hidden border-2 border-primary/20">
<img class="w-full h-full object-cover" data-alt="close-up portrait of a professional man with friendly expression against a clean dark studio background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCEKeZTs3GTXE7Z7KETFTRjLHfI0XvFATgEV4jTaMPVp7DOe0QhE3l2cgbw1oOHBKI8chOfbgcllO-mbvRKU9Z03XeG87--TxXNUwpvtZ7Lnd9MD_euk2ZetVcFGL1FIjdzTBXXKB5JLd5HgS66apqAHQEsDh767GfURBMzY-L2SbPcFGaiucHCAiHdtAoGyD98Gk0UJ0s_ZZIv7WvkJCcK6dT6fT_55FdUYcevQNCeya7lWmEo1cxZahJ4IZPOKHfm2Kt8ug9NvBHR"/>
</div>
</div>
</header>
<!-- Main Map Canvas -->
<main class="relative h-screen w-full bg-surface-dim overflow-hidden">
<!-- Simulated Map Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-40 mix-blend-luminosity" data-alt="top-down dark satellite view of an urban city grid with glowing street lights and complex road networks at night" data-location="Nagpur" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQ8U7PYRSH1YpfDZq5C0rWwVTVKcaZNfy7dRf0Dg1EXPnYdLPA-tQ_QvzaeXOdn5PDhazCbJsy11wqJ5f1ruC1IrUAsfnHSS3DrTCi14910lENHmbRJnLNMQxKUfGkn89FUXkFAdkwICpXwniFi6CI-V9uXaOHEoS_9b2_HoIGUJNxR60gpQSpTPy-Fsw7hoN6t5eSdY66wSLbZZYX5nK6ZvTCCBBPfH6vBpbuGzal8EZ9lZPJ9mTpRB4FLn3qXC7oK3Kta80Sc_O_"/>
<div class="absolute inset-0 map-overlay-gradient pointer-events-none"></div>
<!-- Map Hotspots -->
<!-- High Risk (Red) -->
<div class="absolute top-1/3 left-1/4 w-32 h-32 rounded-full hotspot-glow-high"></div>
<div class="absolute top-1/3 left-1/4 w-12 h-12 bg-tertiary-container/40 border-2 border-tertiary rounded-full animate-pulse flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2">
<div class="w-3 h-3 bg-tertiary rounded-full shadow-[0_0_10px_#ff5b56]"></div>
</div>
<!-- Medium Risk (Orange) -->
<div class="absolute top-1/2 right-1/3 w-48 h-48 rounded-full hotspot-glow-med"></div>
<div class="absolute top-1/2 right-1/3 w-10 h-10 bg-amber-500/30 border-2 border-amber-500 rounded-full flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2">
<div class="w-2.5 h-2.5 bg-amber-400 rounded-full shadow-[0_0_10px_#f59e0b]"></div>
</div>
<!-- Low Risk (Green) -->
<div class="absolute bottom-1/4 left-1/2 w-40 h-40 rounded-full hotspot-glow-low"></div>
<div class="absolute bottom-1/4 left-1/2 w-8 h-8 bg-secondary-container/30 border-2 border-secondary rounded-full flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2">
<div class="w-2 h-2 bg-secondary rounded-full shadow-[0_0_10px_#6bdc96]"></div>
</div>
</div>

<div class="absolute top-24 left-6 z-10 space-y-4">
<div class="bg-surface-container/80 backdrop-blur-md rounded-xl p-3 flex flex-col gap-3 shadow-2xl border border-outline-variant/10">
<button class="p-2 hover:bg-surface-container-highest rounded-lg text-on-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<div class="h-px bg-outline-variant/20 mx-1"></div>
<button class="p-2 hover:bg-surface-container-highest rounded-lg text-on-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
</div>
<button class="bg-primary p-3 rounded-xl shadow-[0_10px_20px_rgba(153,203,255,0.3)] text-on-primary">
<span class="material-symbols-outlined" data-icon="my_location" style="font-variation-settings: 'FILL' 1;">my_location</span>
</button>
</div>
<!-- Glassmorphic Bottom Sheet -->
<section class="absolute bottom-24 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-xl z-20">
<div class="bg-slate-900/60 backdrop-blur-2xl rounded-3xl border border-outline-variant/15 p-6 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
<!-- Handle -->
<div class="w-12 h-1.5 bg-surface-container-highest rounded-full mx-auto mb-6"></div>
<div class="flex justify-between items-start mb-6">
<div>
<h2 class="text-2xl font-bold tracking-tight text-on-surface">Crime Hotspots – Nagpur</h2>
<div class="flex items-center gap-2 mt-1">
<span class="flex h-2 w-2 rounded-full bg-secondary animate-pulse"></span>
<span class="text-sm font-medium text-on-surface-variant">18 hotspot areas loaded</span>
</div>
</div>
<button class="p-2 bg-surface-container-highest/50 rounded-full text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="info">info</span>
</button>
</div>
<!-- Bento Style Info Grid -->
<div class="grid grid-cols-3 gap-3">
<div class="bg-surface-container-low/40 rounded-2xl p-4 flex flex-col items-center justify-center text-center">
<div class="w-3 h-3 rounded-full bg-tertiary mb-2 shadow-[0_0_12px_#ff5b56]"></div>
<span class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant">High Risk</span>
<span class="text-lg font-black text-on-surface">4</span>
</div>
<div class="bg-surface-container-low/40 rounded-2xl p-4 flex flex-col items-center justify-center text-center">
<div class="w-3 h-3 rounded-full bg-amber-500 mb-2 shadow-[0_0_12px_#f59e0b]"></div>
<span class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant">Medium</span>
<span class="text-lg font-black text-on-surface">7</span>
</div>
<div class="bg-surface-container-low/40 rounded-2xl p-4 flex flex-col items-center justify-center text-center">
<div class="w-3 h-3 rounded-full bg-secondary mb-2 shadow-[0_0_12px_#6bdc96]"></div>
<span class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant">Low Risk</span>
<span class="text-lg font-black text-on-surface">7</span>
</div>
</div>
<!-- Legend Row -->
<div class="mt-6 pt-4 border-t border-outline-variant/10 flex items-center justify-between">
<div class="flex gap-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-lg text-primary" data-icon="visibility">visibility</span>
<span class="text-xs font-semibold text-on-surface-variant">Active Layers</span>
</div>
</div>
<button class="bg-primary/10 text-primary px-4 py-2 rounded-xl text-xs font-bold hover:bg-primary hover:text-on-primary transition-all duration-300">
                        View Details
                    </button>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-slate-900/90 backdrop-blur-xl z-50 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.4)]">
<div class="flex flex-col items-center justify-center bg-blue-500/20 text-blue-300 rounded-xl p-2 px-4 shadow-[0_0_15px_rgba(59,130,246,0.3)] transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="map" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="text-[10px] font-bold uppercase tracking-widest Inter mt-1">Map</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 p-2 hover:text-blue-200 transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="directions">directions</span>
<span class="text-[10px] font-bold uppercase tracking-widest Inter mt-1">Route</span>
</div>
<!-- Center Action Button (Report) -->
<div class="relative -top-8 bg-tertiary-container text-white p-4 rounded-full shadow-[0_10px_30px_rgba(255,91,86,0.4)] flex flex-col items-center justify-center transition-transform active:scale-90">
<span class="material-symbols-outlined text-2xl" data-icon="report_problem" style="font-variation-settings: 'FILL' 1;">report_problem</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 p-2 hover:text-blue-200 transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="lightbulb">lightbulb</span>
<span class="text-[10px] font-bold uppercase tracking-widest Inter mt-1">Tips</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 p-2 hover:text-blue-200 transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[10px] font-bold uppercase tracking-widest Inter mt-1">Profile</span>
</div>
